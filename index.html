function renderLibrary(v){head('Biblioteca','Tu colección personal de lecturas y materiales.','CONOCIMIENTO / BIBLIOTECA');v.innerHTML=`<div class="card"><div class="sectionhead" style="margin-top:0"><div><h2>Biblioteca digital</h2><div class="muted">Añade títulos y adjunta un archivo local cuando lo necesites.</div></div><button class="primary" data-act="new-book">＋ Añadir libro</button></div><div class="bookgrid">${db.books.length?db.books.map(b=>`<div class="book"><div class="cover">${b.cover?`<img src="${b.cover}" alt="Portada de ${esc(b.title)}">`:'▤'}</div><strong>${esc(b.title)}</strong><small>${esc(b.author||'Autor desconocido')}</small><p><span class="tag">${esc(b.status||'Pendiente')}</span></p><small>${esc(b.filename||b.category||'Sin archivo adjunto')}</small><div class="actions" style="justify-content:center;margin-top:9px">${btn('Editar','edit-book',b.id)}${btn('Quitar','delete-book',b.id)}</div></div>`).join(''):empty('Tu biblioteca está vacía. Añade tu primer libro.')}</div></div><div class="card" id="bookEditor" style="margin-top:16px"><h2 id="bookFormTitle">Añadir a la biblioteca</h2><form id="bookForm"><input type="hidden" name="id"><div class="formgrid"><div><label>Título</label><input name="title" required></div><div><label>Autor</label><input name="author"></div><div><label>Área</label><select name="category"><option>Psicología general</option><option>Clínica</option><option>Cognitiva</option><option>Neuropsicología</option><option>Social</option><option>Investigación</option><option>Otro</option></select></div><div><label>Estado de lectura</label><select name="status"><option>Pendiente</option><option>Leyendo</option><option>Leído</option></select></div></div><label>Notas o reflexión</label><textarea name="notes" rows="3"></textarea><div class="actions"><button class="primary">Guardar libro</button><button type="button" data-act="attach-book">Adjuntar archivo</button><button type="button" data-act="attach-cover">Añadir portada</button></div><p function renderWriter(v){head('Escritorio de escritura','Un espacio tranquilo para desarrollar tus libros.','CREACIÓN / AUTOR');if(!writerProject||!db.projects.some(p=>p.id===writerProject))writerProject=db.projects[0]?.id||null;let p=db.projects.find(x=>x.id===writerProject);if(!p){v.innerHTML=`<div class="card" style="max-width:650px;margin:auto"><h2>Comienza un proyecto editorial</h2><p class="muted">Crea un libro y organiza su contenido por capítulos.</p><form id="projectForm"><label>Título del libro</label><input name="title" required placeholder="Título de tu libro"><label>Tipo de proyecto</label><select name="template"><option>Libro académico de Psicología</option><option>Divulgación psicológica</option><option>Manual de estudio</option><option>Cuaderno de investigación</option><option>Revisión bibliográfica</option><option>Proyecto de tesis</option><option>Diario de aprendizaje</option><option>Plantilla en blanco</option></select><label>Objetivo de palabras</label><input name="goal" type="number" value="20000" min="0"><button class="primary" style="margin-top:15px">Crear proyecto</button></form></div>`;$('#projectForm').onsubmit=e=>{e.preventDefault();let f=e.currentTarget;p={id:uid(),title:f.elements.namedItem('title').value,template:f.elements.namedItem('template').value,goal:+f.elements.namedItem('goal').value,chapters:[{id:uid(),title:'Introducción',content:'',updated:Date.now()}],created:Date.now()};db.projects.unshift(p);writerProject=p.id;writerChapter=p.chapters[0].id;save();render()};return}if(!writerChapter||!p.chapters.some(c=>c.id===writerChapter))writerChapter=p.chapters[0]?.id||null;let ch=p.chapters.find(c=>c.id===writerChapter);let total=p.chapters.reduce((s,c)=>s+words(c.content),0);v.innerHTML=`<div class="sectionhead" style="margin-top:0"><div><select id="projectSelect">${db.projects.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select><div class="muted" style="margin-top:6px">${esc(p.te itor');if(ch){$('#chapterTitle').onchange=e=>{ch.title=e.target.value;save();renderWriter(v)};ed.addEventListener('input',()=>{ch.content=ed.innerHTML;ch.updated=Date.now();let w=words(ed.innerText);$('#wordCount').textContent=w+' palabras';let d=today();db.dailyWords[d]=(db.dailyWords[d]||0)+0;save()})}}

function renderCalendar(v){head('Calendario','Organiza fechas, entregas y recordatorios.','PLANIFICACIÓN / CALENDARIO');let y=monthDate.getFullYear(),m=monthDate.getMonth(),first=new Date(y,m,1),start=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate(),cells=[];for(let i=0;i<42;i++){let n=i-start+1,dt=n<1?new Date(y,m-1,prev+n):n>days?new Date(y,m+1,n-days):new Date(y,m,n),iso=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`,outside=n<1||n>days,ev=db.events.filter(e=>e.date===iso);cells.push(`<div class="day ${outside?'mutedday':''} ${iso===today()?'today':''} ${iso===selectedDate?'selected':''}" data-act="select-date" data-id="${iso}"><b>${dt.getDate()}</b>${ev.slice(0,2).map(e=>`<span class="eventdot">${esc(e.title)}</span>`).join('')}${ev.length>2?`<small>+${ev.length-2}</small>`:''}</div>`)}v.innerHTML=`<div class="card"><div class="calendar-head"><button data-act="month-prev">←</button><h2>${monthDate.toLocaleDateString('es-ES',{month:'long',year:'numeric'})}</h2><div class="actions"><button data-act="month-today">Hoy</button><button data-act="month-next">→</button></div></div><div class="calgrid">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(x=>`<div class="caldayname">${x}</div>`).join('')}${cells.join('')}</div></div><div class="grid two" style="margin-top:16px"><section class="card"><h2>Eventos · ${fmtDate(selectedDate)}</h2><div class="list">${db.events.filter(e=>e.date===selectedDate).map(e=>item(e.title,e.description,e.time||'Sin hora',btn('Editar','event-edit',e.id)+btn('Eliminar','event-delete',e.id))).join('')||empty('No hay eventos para este día.')}</div></section><section class="card"><h2 id="eventFormTitle">Añadir evento</h2><form id="eventForm"><input type="hidden" name="id"><label>Título</label><input name="title" required><div class="formgrid"><div><label>Fecha</label><input name="date" type="date" value="${selectedDate}" required></div><div><label>Hora</label><input name="time" type="time"></div></div><label>Descripción</label><textarea name="description" rows="3"></textarea><button class="primary" style="margin-top:12px">Guardar evento</button></form></section></div>`;$('#eventForm').onsubmit=e=>{e.preventDefault();let f=e.currentTarget,old=db.events.find(x=>x.id===f.elements.namedItem('id').value),obj={id:f.elements.namedItem('id').value||uid(),title:f.elements.namedItem('title').value,date:f.elements.namedItem('date').value,time:f.elements.namedItem('time').value,description:f.elements.namedItem('description').value};if(old)Object.assign(old,obj);else db.events.push(obj);selectedDate=obj.date;save();renderCalendar(v);notify('Evento guardado')}}
function renderPomodoro(v){head('Pomodoro','Protege tu atención y toma descansos conscientes.','CONCENTRACIÓN / POMODORO');let p=db.pomodoro;v.innerHTML=`<div class="grid two"><section class="card timer"><div class="timer-mode">${p.mode==='focus'?'Concentración':p.mode==='short'?'Descanso corto':'Descanso largo'}</div><div class="clock" id="clock">${clock(p.remaining)}</div><div class="muted" id="timerHint">${p.running?'Sesión en curso':'Listo cuando tú lo estés'}</div><div class="progress"><span id="timerProgress" style="width:${100-p.remaining/(p[p.mode]||25*60)*100}%"></span></div><div class="actions" style="justify-content:center"><button class="primary" data-act="timer-toggle">${p.running?'Pausar':'Iniciar'}</button><button data-act="timer-reset">Reiniciar</button><button data-act="timer-skip">Saltar intervalo</button></div><p class="footnote">Sesiones completadas: ${p.round} · La alarma requiere pulsar «DETENER ALARMA».</p></section><section class="card"><h2>Preferencias</h2><form id="timerForm"><label>Concentración (minutos)</label><input name="focus" type="number" min="1" max="180" value="${p.focus}"><label>Descanso corto (minutos)</label><input name="short" type="number" min="1" max="60" value="${p.short}"><label>Descanso largo (minutos)</label><input name="long" type="number" min="1" max="90" value="${p.long}"><label><input style="width:auto" type="checkbox" name="autoBreak" ${p.autoBreak?'checked':''}> Iniciar descansos automáticamente</label><label><input style="width:auto" type="checkbox" name="autoFocus" ${p.autoFocus?'checked':''}> Iniciar concentración automáticamente</label><button class="primary" style="margin-top:12px">Guardar preferencias</button></form><hr class="hr"><p class="muted">Mantén esta pestaña abierta para que la alarma pueda sonar. Algunos navegadores requieren una interacción previa para activar el sonido.</p></section></div>`;$('#timerForm').onsubmit=e=>{e.preventDefault();let f=e.currentTarget;p.focus=+f.elements.namedItem('focus').value;p.short=+f.elements.namedItem('short').value;p.long=+f.elements.namedItem('long').value;p.autoBreak=f.elements.namedItem('autoBreak').checked;p.autoFocus=f.elements.namedItem('autoFocus').checked;if(!p.running)p.remaining=(p[p.mode]||25)*60;save();renderPomodoro(v);notify('Preferencias guardadas')}}function clock(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function updateTimerUI(){let p=db.pomodoro;if(!p)return;let c=$('#clock');if(c)c.textContent=clock(p.remaining);let h=$('#timerHint');if(h)h.textContent=p.running?'Sesión en curso':'Listo cuando tú lo estés';let bar=$('#timerProgress');if(bar)bar.style.width=(100-p.remaining/((p[p.mode]||25)*60)*100)+'%'}let ticker=setInterval(()=>{let p=db.pomodoro;if(p.running&&p.until){p.remaining=Math.max(0,(p.until-Date.now())/1000);if(p.remaining<=0){p.remaining=0;p.running=false;p.until=null;p.alarm=true;save();startAlarm();if(page==='pomodoro')render();else notify('Pomodoro terminado: abre Pomodoro para detener la alarma.')}else{save();updateTimerUI()}}},500);function startAlarm(){const el=$('#alarm');el.classList.add('show');try{let C=window.AudioContext||window.webkitAudioContext;if(C){alarmAudio=new C();let beep=()=>{if(!db.pomodoro.alarm)return;let o=alarmAudio.createOscillator(),g=alarmAudio.createGain();o.type='sine';o.frequency.value=880;g.gain.value=.18;o.connect(g);g.connect(alarmAudio.destination);o.start();o.stop(alarmAudio.currentTime+.25);setTimeout(()=>{if(db.pomodoro.alarm) {let o2=alarmAudio.createOscillator(),g2=alarmAudio.createGain();o2.frequency.value=660;g2.gain.value=.18;o2.connect(g2);g2.connect(alarmAudio.destination);o2.start();o2.stop(alarmAudio.currentTime+.25)}},350)};beep();alarmLoop=setInterval(beep,1100)}}catch(e){}}function stopAlarm(){db.pomodoro.alarm=false;clearInterval(alarmLoop);alarmLoop=null;try{alarmAudio?.close()}catch{}$('#alarm').classList.remove('show');save()}

function doAction(act,id,extra){let v=$('#view');switch(act){case'go':setPage(id);break;case'new-note':editId=null;renderNotes(v);$('#noteForm')?.title.focus();break;case'edit-note':editId=id;page='notes';$$('.nav[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page==='notes'));renderNotes($('#view'));break;case'fav-note':{let n=db.notes.find(n=>n.id===id);if(n)n.favorite=!n.favorite;save();render();break}case'trash-note':{let n=db.notes.find(n=>n.id===id);if(n)n.deleted=true;save();render();break}case'restore-note':{let n=db.notes.find(n=>n.id===id);if(n)n.deleted=false;save();render();break}case'purge-note':if(confirm('¿Eliminar esta nota definitivamente?')){db.notes=db.notes.filter(n=>n.id!==id);save();render()}break;case'reset-note':editId=null;renderNotes(v);break;case'new-book':$('#bookForm').reset();$('#bookForm').elements.namedItem('id').value='';break;case'edit-book':{let b=db.books.find(b=>b.id===id),f=$('#bookForm');if(!b||!f)return;f.elements.namedItem('id').value=id;f.elements.namedItem('title').value=b.title;f.elements.namedItem('author').value=b.author;f.elements.namedItem('category').value=b.category;f.elements.namedItem('status').value=b.status;f.elements.namedItem('notes').value=b.notes;$('#bookFormTitle').textContent='Editar libro';$('#bookEditor').scrollIntoView({behavior:'smooth'});break}case'delete-book':if(confirm('¿Quitar este libro de la biblioteca?')){db.books=db.books.filter(b=>b.id!==id);save();render()}break;case'fav-book':{let b=db.books.find(b=>b.id===id);if(b)b.favorite=!b.favorite;save();render()}break;case'attach-book':$('#bookFile').click();break;case'attach-cover':$('#coverFile').click();break;case'new-project':writerProject=null;renderWriter(v);break;case'new-chapter':{let p=db.projects.find(p=>p.id===writerProject);if(!p)return;let c={id:uid(),title:'Nuevo capítulo',content:'',updated:Date.now()};p.chapters.push(c);writerChapter=c.id;save();renderWriter(v);break}case'select-chapter':writerChapter=id;renderWriter(v);break;case'rename-chapter':{let p=db.projects.find(p=>p.id===writerProject),c=p?.chapters.find(c=>c.id===id),name=prompt('Nombre del capítulo:',c?.title||'');if(c&&name){c.title=name;save();render()}break}case'delete-chapter':if(confirm('¿Eliminar este capítulo?')){let p=db.projects.find(p=>p.id===writerProject);p.chapters=p.chapters.filter(c=>c.id!==id);writerChapter=null;save();render()}break;case'format':document.execCommand(id,false,extra||null);$('#chapterEditor')?.focus();break;case'focus-writer':document.querySelector('.writer')?.requestFullscreen?.();break;case'export-project':{let p=db.projects.find(p=>p.id===id);if(p)download((p.title||'libro').replace(/[^a-z0-9-_]/gi,'_')+'.txt',p.title+'\n\n'+p.chapters.map(c=>'# '+c.title+'\n\n'+c.content.replace(/<[^>]+>/g,' ')).join('\n\n'));break}case'month-prev':monthDate=new Date(monthDate.getFullYear(),monthDate.getMonth()-1,1);render();break;case'month-next':monthDate=new Date(monthDate.getFullYear(),monthDate.getMonth()+1,1);render();break;case'month-today':monthDate=new Date();selectedDate=today();render();break;case'select-date':selectedDate=id;render();break;case'event-edit':{let e=db.events.find(x=>x.id===id),f=$('#eventForm');if(e&&f){f.elements.namedItem('id').value=id;f.elements.namedItem('title').value=e.title;f.elements.namedItem('date').value=e.date;f.elements.namedItem('time').value=e.time;f.elements.namedItem('description').value=e.description;$('#eventFormTitle').textContent='Editar evento'}break}case'event-delete':if(confirm('¿Eliminar este evento?')){db.events=db.events.filter(e=>e.id!==id);save();render()}break;case'timer-toggle':{let p=db.pomodoro;if(p.running){p.remaining=Math.max(0,(p.until-Date.now())/1000);p.running=false;p.until=null}else{if(p.alarm){notify('Primero detén la alarma.');return}p.running=true;p.until=Date.now()+p.remaining*1000;try{let C=window.AudioContext||window.webkitAudioContext;if(C){let a=new C();a.resume();a.close()}}catch{}}save();render();break}case'timer-reset':{le function nextMode(){let p=db.pomodoro;if(p.mode==='focus'){p.round++;p.mode=p.round%4===0?'long':'short'}else p.mode='focus';p.remaining=p[p.mode]*60;if((p.mode==='focus'&&p.autoFocus)||(p.mode!=='focus'&&p.autoBreak)){p.running=true;p.until=Date.now()+p.remaining*1000}}

iente',notes:'',filename:f.name,cover:'',created:Date.now()};db.books.unshift(o);b=o;form.elements.namedItem('id').value=o.id;form.elements.namedItem('title').value=o.title;form.elements.namedItem('category').value=o.category;form.elements.namedItem('status').value=o.status}else b.filename=f.name;$('#bookFileLabel').textContent='Archivo seleccionado: '+f.name+' ('+(f.size/1024/1024).toFixed(2)+' MB). Por compatibilidad, el contenido del documento no se almacena en esta versión.';save();renderLibrary($('#view'));notify('Metadatos del archivo añadidos');e.target.value=''};$('#coverFile').onchange=e=>{let f=e.target.files[0];if(!f)return;if(f.size>1200000){alert('Elige una imagen de menos de 1,2 MB para evitar llenar el almacenamiento local.');return}let r=new FileReader();r.onload=()=>{let id=$('#bookForm').elements.namedItem('id').value,b=db.books.find(x=>x.id===id);if(!b){b={id:uid(),title:'Nuevo libro',author:'',category:'Psicología general',status:'Pendiente',notes:'',filename:'',cover:r.result,created:Date.now()};db.books.unshift(b);$('#bookForm').elements.namedItem('id').value=b.id;$('#bookForm').title.value=b.title}else b.cover=r.result;save();renderLibrary($('#view'));notify('Portada añadida')};r.readAsDataURL(f);e.target.value=''};$('#view').addEventListener('submit',e=>{if(e.target.id==='taskForm'||e.target.id==='researchForm'){} });$('#view').addEventListener('submit',e=>{});$('#view').addEventListener('click',e=>{let b=e.target.closest('[data-act="new-project"]');if(b){let title=prompt('Título del proyecto:');if(!title)return;let p={id:uid(),title,template:'Plantilla en blanco',goal:20000,chapters:[{id:uid(),title:'Introducción',content:'',updated:Date.now()}],created:Date.now()};db.projects.unshift(p);writerProject=p.id;writerChapter=p.chapters[0].id;save();render()}});function restoreTimer(){let p=db.pomodoro;if(p.running&&p.until){p.remaining=Math.max(0,(p.until-Date.now())/1000);if(p.remaining<=0){p.running=false;p.until=null;p.alarm=true;startAlarm()}else save()}if(p.alarm)startAlarm()}restoreTimer();render();
